name: Frontend Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (verifies TypeScript + Next.js compile cleanly)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://payment-app-backend-do9a.onrender.com
